<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บไซต์สื่อการเรียนการสอน</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #4f46e5; --secondary: #3b82f6; --bg: #f3f4f6; --text: #1f2937;
    }
    body {
      font-family: 'Prompt', sans-serif; background: var(--bg);
      background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 20px 20px;
      margin: 0; padding: 0; color: var(--text); overflow-x: hidden;
    }

    /* ================= 1. หน้าต่างต้อนรับ (Splash Screen) ================= */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white; z-index: 9999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .splash-content { animation: floatUp 1s ease-out; padding: 20px; }
    .splash-content h1 { font-size: 3rem; margin-bottom: 10px; font-weight: 700; text-shadow: 2px 4px 10px rgba(0,0,0,0.3); }
    .splash-content h2 { font-size: 2rem; font-weight: 300; margin-bottom: 40px; color: #e0e7ff; }
    .enter-btn {
      background: white; color: var(--primary); border: none; padding: 15px 50px;
      font-family: 'Prompt', sans-serif; font-size: 22px; font-weight: 600;
      border-radius: 50px; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: 0.3s;
    }
    .enter-btn:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
    @keyframes floatUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }

    /* ================= 2. ส่วนหัวและเมนู ================= */
    .header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white; padding: 50px 20px; text-align: center; position: relative;
      border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
      box-shadow: 0 10px 30px rgba(79, 70, 229, 0.2);
    }
    .header h1 { margin: 0; font-size: 38px; font-weight: 600; }
    .header p { margin: 10px 0 0 0; font-size: 20px; font-weight: 300; opacity: 0.9; }
    
    .admin-icon {
      position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2);
      border: none; color: white; font-size: 24px; padding: 10px 15px;
      border-radius: 50%; cursor: pointer; backdrop-filter: blur(5px); transition: 0.3s;
    }
    .admin-icon:hover { background: rgba(255,255,255,0.4); transform: rotate(90deg); }

    .nav-menu { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: -25px; position: relative; z-index: 10; padding: 0 20px; }
    .nav-btn {
      background: white; border: none; padding: 12px 25px; border-radius: 50px;
      font-family: 'Prompt', sans-serif; font-size: 16px; font-weight: 500;
      color: var(--primary); cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.08); transition: 0.3s;
    }
    .nav-btn:hover { background: var(--primary); color: white; transform: translateY(-3px); }

    /* ================= 3. พื้นที่เนื้อหา ================= */
    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .card {
      background: white; border-radius: 20px; padding: 25px; margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: relative;
    }
    .card-header { display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-start; }
    .card-image { width: 150px; height: 150px; border-radius: 15px; object-fit: cover; }
    .card-info { flex: 1; }
    .card-title { font-size: 22px; color: var(--primary); margin: 0 0 10px 0; }
    .card-desc { font-size: 15px; color: #6b7280; line-height: 1.6; background: #f8fafc; padding: 15px; border-radius: 12px; border-left: 4px solid var(--primary); }
    .card iframe { width: 100%; height: 500px; border: none; border-radius: 15px; background: #f3f4f6; }
    
    /* ปุ่มลบ (จะแสดงเฉพาะตอน Admin ล็อกอิน) */
    .delete-btn {
      position: absolute; top: 20px; right: 20px; background: #ef4444; color: white;
      border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Prompt'; font-size: 14px;
    }
    .delete-btn:hover { background: #dc2626; }

    /* ================= 4. ระบบหลังบ้าน (Admin) ================= */
    .admin-box {
      background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); display: none;
      border-top: 5px solid #f59e0b; margin-bottom: 30px;
    }
    .admin-section-title { color: #d97706; border-bottom: 2px solid #fef3c7; padding-bottom: 10px; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 8px; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-family: 'Prompt'; font-size: 15px; box-sizing: border-box; }
    
    .btn-group { display: flex; gap: 10px; }
    .btn-green { background: #10b981; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Prompt'; width: 100%; font-size: 16px; }
    .btn-blue { background: #3b82f6; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Prompt'; width: 100%; font-size: 16px; }

    @media (max-width: 768px) {
      .splash-content h1 { font-size: 2rem; }
      .splash-content h2 { font-size: 1.5rem; }
      .card-header { flex-direction: column; }
      .card-image { width: 100%; height: 200px; }
      .card iframe { height: 350px; }
    }
  </style>
</head>
<body>

  <!-- ================= หน้าต้อนรับ ================= -->
  <div id="splash-screen">
    <div class="splash-content">
      <h1>ยินดีต้อนรับนักเรียนระดับชั้นประถมศึกษาปีที่ 6</h1>
      <h2>เรื่อง ภาษาถิ่น</h2>
      <button class="enter-btn" onclick="enterSite()">🚀 เข้าสู่เว็บไซต์</button>
    </div>
  </div>

  <!-- ================= ส่วนหัวเว็บไซต์ ================= -->
  <div class="header">
    <button class="admin-icon" onclick="checkAdmin()" title="จัดการระบบ">⚙️</button>
    <h1 id="displayTitle">กำลังโหลด...</h1>
    <p id="displaySubtitle">กรุณารอสักครู่</p>
  </div>

  <!-- เมนูหลัก (จะถูกดึงมาใส่ตรงนี้อัตโนมัติ) -->
  <div class="nav-menu" id="menuContainer"></div>

  <div class="container">
    
    <!-- ================= พื้นที่แสดงสื่อ ================= -->
    <div id="display-section">
      <div class="card" style="text-align: center; color: #6b7280; padding: 50px 20px;">
        <h2 style="color: var(--primary);">ยินดีต้อนรับเข้าสู่บทเรียน! 🎉</h2>
        <p>กรุณาคลิกเลือกเมนูด้านบน เพื่อเริ่มต้นการเรียนรู้ได้เลยค่ะ</p>
      </div>
    </div>

    <!-- ================= ระบบหลังบ้าน ================= -->
    <div id="admin-section" class="admin-box">
      
      <!-- ส่วนที่ 1: ตั้งค่าหัวเว็บไซต์ และ เมนู -->
      <h2 class="admin-section-title">⚙️ 1. ตั้งค่าเว็บไซต์ & เมนูหลัก</h2>
      <div class="form-group">
        <label>ชื่อเว็บไซต์หลัก:</label>
        <input type="text" id="siteTitleInput" class="form-control">
      </div>
      <div class="form-group">
        <label>คำอธิบายใต้ชื่อเว็บ:</label>
        <input type="text" id="siteSubtitleInput" class="form-control">
      </div>
      <button class="btn-blue" onclick="saveSiteSettings()" style="margin-bottom: 20px;">💾 บันทึกหัวเว็บไซต์</button>

      <div class="form-group" style="background: #f8fafc; padding: 15px; border-radius: 10px;">
        <label style="color: #047857;">➕ เพิ่มเมนูใหม่ (หมวดหมู่ใหม่):</label>
        <div class="btn-group">
          <input type="text" id="newMenuInput" class="form-control" placeholder="เช่น แบบทดสอบหลังเรียน">
          <button class="btn-green" style="width: auto; white-space: nowrap;" onclick="addNewMenu()">เพิ่มเมนู</button>
        </div>
      </div>

      <hr style="border: 1px solid #e5e7eb; margin: 30px 0;">

      <!-- ส่วนที่ 2: เพิ่มเนื้อหาสื่อ -->
      <h2 class="admin-section-title">📚 2. เพิ่มสื่อการเรียนรู้ (วิดีโอ/เกม/ใบงาน)</h2>
      <div class="form-group">
        <label>เลือกเมนู (หมวดหมู่):</label>
        <select id="categorySelect" class="form-control"></select>
      </div>
      <div class="form-group">
        <label>ชื่อเรื่อง / หัวข้อ:</label>
        <input type="text" id="title" class="form-control" placeholder="เช่น การอ่านออกเสียงภาษาถิ่นเหนือ">
      </div>
      <div class="form-group">
        <label>คำอธิบาย / ความหมาย:</label>
        <textarea id="description" class="form-control" rows="3" placeholder="อธิบายเนื้อหา..."></textarea>
      </div>
      <div class="form-group">
        <label>ลิงก์รูปภาพประกอบ (ถ้ามี):</label>
        <input type="url" id="imgUrl" class="form-control" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>โค้ดฝังสื่อ (iframe) หรือลิงก์ YouTube:</label>
        <textarea id="embedCode" class="form-control" rows="4" placeholder="วางลิงก์วิดีโอ หรือ โค้ด iframe"></textarea>
      </div>
      <button class="btn-green" onclick="saveMedia()">🚀 อัปโหลดสื่อขึ้นเว็บไซต์</button>
    </div>

  </div>

  <!-- โหลด Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    // กุญแจ Firebase 
    const firebaseConfig = {
      apiKey: "AIzaSyD34HFIpO9LQc0GuFfiC1FuBd7fROOvIco",
      authDomain: "cee3501-9eba6.firebaseapp.com",
      databaseURL: "https://cee3501-9eba6-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cee3501-9eba6",
      storageBucket: "cee3501-9eba6.firebasestorage.app",
      messagingSenderId: "699916890411",
      appId: "1:699916890411:web:414a654d8024adbe33956e"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ตัวแปรระบบ
    let isAdminLoggedIn = false;
    let currentCategoryView = '';
    let siteData = {
      title: "ระบบสื่อการเรียนการสอน",
      subtitle: "โมเดลห้องเรียนแห่งความสุข",
      menus: [
        { id: "indicator", name: "🎯 มาตรฐานและตัวชี้วัด" },
        { id: "content", name: "📖 เนื้อหาบทเรียน" },
        { id: "video", name: "🎬 สื่อวีดิทัศน์" },
        { id: "game", name: "🎮 เกมการศึกษา" },
        { id: "worksheet", name: "📝 ใบงาน" }
      ]
    };

    // 1. ฟังก์ชันปิดหน้า Splash Screen
    function enterSite() {
      const splash = document.getElementById('splash-screen');
      splash.style.opacity = '0';
      splash.style.transform = 'scale(1.1)';
      setTimeout(() => { splash.style.display = 'none'; }, 800);
      loadSiteSettings(); // โหลดข้อมูลเว็บเมื่อกดเข้า
    }

    // 2. ดึงข้อมูลตั้งค่าเว็บไซต์และเมนูจาก Firebase
    function loadSiteSettings() {
      db.collection("settings").doc("siteConfig").get().then((doc) => {
        if (doc.exists) {
          siteData = doc.data(); // ดึงของที่บันทึกไว้มาใช้
        }
        renderSiteUI();
      });
    }

    // 3. นำข้อมูลมาวาดลงหน้าเว็บ (หัวเว็บ + เมนู)
    function renderSiteUI() {
      document.getElementById('displayTitle').innerText = siteData.title;
      document.getElementById('displaySubtitle').innerText = siteData.subtitle;
      document.getElementById('siteTitleInput').value = siteData.title;
      document.getElementById('siteSubtitleInput').value = siteData.subtitle;

      let menuHtml = '';
      let selectHtml = '';
      siteData.menus.forEach(menu => {
        menuHtml += `<button class="nav-btn" onclick="loadMedia('${menu.id}')">${menu.name}</button>`;
        selectHtml += `<option value="${menu.id}">${menu.name}</option>`;
      });
      document.getElementById('menuContainer').innerHTML = menuHtml;
      document.getElementById('categorySelect').innerHTML = selectHtml;
    }

    // 4. เข้าระบบ Admin
    function checkAdmin() {
      if(isAdminLoggedIn) { // ถ้าล็อกอินอยู่แล้ว ให้ปิด/เปิด หน้าแอดมินสลับกัน
        document.getElementById('admin-section').style.display = document.getElementById('admin-section').style.display === 'none' ? 'block' : 'none';
        return;
      }
      
      const password = prompt("รหัสผ่านผู้ดูแลระบบ:");
      if (password === "1234") {
        isAdminLoggedIn = true;
        document.getElementById('admin-section').style.display = "block";
        alert("ปลดล็อกโหมดแอดมินแล้ว! คุณสามารถลบสื่อ และแก้ไขหัวเว็บได้");
        if(currentCategoryView) loadMedia(currentCategoryView); // รีเฟรชเพื่อโชว์ปุ่มลบ
      } else if (password !== null) {
        alert("รหัสผ่านไม่ถูกต้อง!");
      }
    }

    // 5. บันทึกการแก้ไขหัวเว็บ
    function saveSiteSettings() {
      siteData.title = document.getElementById('siteTitleInput').value;
      siteData.subtitle = document.getElementById('siteSubtitleInput').value;
      
      db.collection("settings").doc("siteConfig").set(siteData).then(() => {
        alert("อัปเดตหัวเว็บไซต์เรียบร้อย!");
        renderSiteUI();
      });
    }

    // 6. เพิ่มเมนูใหม่
    function addNewMenu() {
      const newMenuName = document.getElementById('newMenuInput').value;
      if(!newMenuName) return alert("กรุณาพิมพ์ชื่อเมนู");
      
      const newMenuId = "menu_" + Date.now(); // สร้าง ID อัตโนมัติ
      siteData.menus.push({ id: newMenuId, name: "📌 " + newMenuName });
      
      db.collection("settings").doc("siteConfig").set(siteData).then(() => {
        alert("เพิ่มเมนูใหม่เรียบร้อย!");
        document.getElementById('newMenuInput').value = '';
        renderSiteUI();
      });
    }

    // 7. โหลดเนื้อหาสื่อ (ซ่อนแอดมิน โชว์สื่อ)
    function loadMedia(categoryId) {
      currentCategoryView = categoryId;
      const display = document.getElementById('display-section');
      display.innerHTML = "<div style='text-align:center; padding: 50px;'><h3>กำลังโหลดเนื้อหา... ⏳</h3></div>";

      db.collection("medias").where("category", "==", categoryId).orderBy("timestamp", "desc").get()
        .then((querySnapshot) => {
          display.innerHTML = "";
          if(querySnapshot.empty) {
            display.innerHTML = "<div class='card' style='text-align:center;'>ยังไม่มีเนื้อหาในหมวดหมู่นี้ค่ะ 📚</div>";
            return;
          }
          
          querySnapshot.forEach((doc) => {
            const data = doc.data();
            
            // ปุ่มลบ จะโชว์ต่อเมื่อ isAdminLoggedIn = true
            let deleteBtnHtml = isAdminLoggedIn ? `<button class="delete-btn" onclick="deleteMedia('${doc.id}')">🗑️ ลบสื่อนี้</button>` : '';
            
            let imageHTML = data.imgUrl ? `<img src="${data.imgUrl}" class="card-image">` : '';
            let descHTML = data.description ? `<p class="card-desc">${data.description.replace(/\n/g, '<br>')}</p>` : '';
            
            let headerHTML = '';
            if (imageHTML || descHTML) {
                headerHTML = `<div class="card-header">${imageHTML}<div class="card-info"><h2 class="card-title">${data.title}</h2>${descHTML}</div></div>`;
            } else {
                headerHTML = `<h2 class="card-title" style="margin-bottom:15px;">${data.title}</h2>`;
            }

            const div = document.createElement('div');
            div.className = "card";
            div.innerHTML = deleteBtnHtml + headerHTML + data.embedCode;
            display.appendChild(div);
          });
        })
        .catch((err) => { console.error(err); });
    }

    // 8. ฟังก์ชันบันทึกสื่อ
    function saveMedia() {
      const title = document.getElementById('title').value;
      const category = document.getElementById('categorySelect').value;
      const description = document.getElementById('description').value;
      const imgUrl = document.getElementById('imgUrl').value;
      let embed = document.getElementById('embedCode').value;

      if(!title) return alert("กรุณากรอกชื่อเรื่อง!");

      // แปลงลิงก์ YouTube อัตโนมัติ
      if(embed.includes("youtube.com/watch?v=")) {
        const videoId = embed.split("v=")[1].substring(0, 11);
        embed = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
      } else if (embed.includes("youtu.be/")) {
        const videoId = embed.split("youtu.be/")[1].substring(0, 11);
        embed = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
      }

      db.collection("medias").add({
        title: title, category: category, description: description,
        imgUrl: imgUrl, embedCode: embed, timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("🎉 จัดเก็บข้อมูลสำเร็จแล้ว!");
        document.getElementById('title').value = '';
        document.getElementById('description').value = '';
        document.getElementById('embedCode').value = '';
        loadMedia(category); // รีเฟรชหน้าโชว์ผลงาน
      });
    }

    // 9. ฟังก์ชันลบสื่อ
    function deleteMedia(docId) {
      if(confirm("คุณแน่ใจหรือไม่ว่าต้องการลบสื่อนี้? (ลบแล้วกู้คืนไม่ได้นะ)")) {
        db.collection("medias").doc(docId).delete().then(() => {
          alert("ลบสื่อเรียบร้อยแล้ว");
          loadMedia(currentCategoryView); // รีเฟรชหน้า
        });
      }
    }
  </script>
</body>
</html>
