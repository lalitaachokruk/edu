<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบคลังสื่อการเรียนรู้</title>
  <!-- นำเข้าฟอนต์ Prompt จาก Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* ================= 1. ดีไซน์หลัก (Global) ================= */
    :root {
      --primary-color: #4f46e5;
      --secondary-color: #4338ca;
      --bg-color: #f3f4f6;
      --text-main: #1f2937;
      --text-light: #6b7280;
    }
    body {
      font-family: 'Prompt', sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
      background-size: 20px 20px;
      margin: 0; padding: 0; color: var(--text-main);
    }
    
    /* ================= 2. ส่วนหัวเว็บไซต์ (Header) ================= */
    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: white; padding: 40px 20px; text-align: center;
      position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
    }
    .header h1 { margin: 0; font-size: 36px; font-weight: 600; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
    .header p { margin: 10px 0 0 0; font-size: 18px; font-weight: 300; opacity: 0.9; }
    
    /* ปุ่ม Admin แอบมุมขวา */
    .admin-icon {
      position: absolute; top: 20px; right: 20px;
      background: rgba(255, 255, 255, 0.2); border: none;
      color: white; font-size: 20px; padding: 10px;
      border-radius: 50%; cursor: pointer; transition: 0.3s;
      backdrop-filter: blur(5px);
    }
    .admin-icon:hover { background: rgba(255, 255, 255, 0.4); transform: rotate(90deg); }

    /* ================= 3. เมนูนำทาง (Navigation) ================= */
    .nav-menu { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: -25px; position: relative; z-index: 10; }
    .nav-btn {
      background: white; border: none; padding: 12px 25px;
      border-radius: 50px; font-family: 'Prompt', sans-serif; font-size: 16px; font-weight: 500;
      color: var(--primary-color); cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: all 0.3s ease;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--primary-color); color: white; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
    }

    /* ================= 4. พื้นที่แสดงเนื้อหา (Content Area) ================= */
    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    
    /* ดีไซน์การ์ดเนื้อหา (Card UI) */
    .card {
      background: white; border-radius: 20px; padding: 25px; margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: transform 0.3s;
      animation: fadeIn 0.5s ease;
    }
    .card:hover { transform: translateY(-5px); }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* ส่วนหัวการ์ด (รูป + ข้อความ) */
    .card-header { display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-start; }
    .card-image {
      width: 150px; height: 150px; border-radius: 15px; object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .card-info { flex: 1; }
    .card-title { font-size: 22px; color: var(--primary-color); margin: 0 0 10px 0; font-weight: 600; }
    .card-desc { font-size: 15px; color: var(--text-light); line-height: 1.6; margin: 0; background: #f8fafc; padding: 15px; border-radius: 12px; border-left: 4px solid var(--primary-color); }
    
    /* ส่วน iframe (วิดีโอ/เกม) */
    .card iframe { width: 100%; height: 500px; border: none; border-radius: 15px; background: #f3f4f6; overflow: auto; }

    /* ================= 5. ระบบหลังบ้าน (Admin Panel) ================= */
    .admin-box {
      background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); display: none;
      border-top: 5px solid #f59e0b;
    }
    .admin-box h2 { margin-top: 0; color: #d97706; font-size: 24px; text-align: center; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 8px; color: #374151; }
    .form-control {
      width: 100%; padding: 12px 15px; border: 1px solid #d1d5db; border-radius: 10px;
      font-family: 'Prompt', sans-serif; font-size: 15px; box-sizing: border-box; transition: 0.3s;
    }
    .form-control:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    .save-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white;
      padding: 15px 20px; border: none; border-radius: 10px; cursor: pointer;
      font-size: 18px; font-weight: 600; width: 100%; transition: 0.3s; font-family: 'Prompt', sans-serif;
    }
    .save-btn:hover { box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); transform: translateY(-2px); }

    /* Responsive มือถือ */
    @media (max-width: 768px) {
      .card-header { flex-direction: column; }
      .card-image { width: 100%; height: 200px; }
      .card iframe { height: 350px; }
      .header h1 { font-size: 28px; }
    }
  </style>
</head>
<body>

  <!-- ส่วนหัว -->
  <div class="header">
    <!-- กดปุ่ม ⚙️ เพื่อเข้าระบบแอดมิน -->
    <button class="admin-icon" onclick="checkAdmin()" title="จัดการระบบ">⚙️</button>
    <h1>เว็บไซต์สื่อการเรียนการสอน</h1>
    <p>โมเดลห้องเรียนแห่งความสุข (Happy Classroom)</p>
  </div>

  <!-- เมนูหลัก -->
  <div class="nav-menu">
    <button class="nav-btn" onclick="loadData('indicator')">🎯 มาตรฐานและตัวชี้วัด</button>
    <button class="nav-btn" onclick="loadData('content')">📖 เนื้อหาบทเรียน</button>
    <button class="nav-btn" onclick="loadData('video')">🎬 สื่อวีดิทัศน์</button>
    <button class="nav-btn" onclick="loadData('game')">🎮 เกมการศึกษา</button>
    <button class="nav-btn" onclick="loadData('worksheet')">📝 ใบงาน</button>
  </div>

  <div class="container">
    
    <!-- พื้นที่โชว์สื่อของนักเรียน -->
    <div id="display-section">
      <div class="card" style="text-align: center; color: var(--text-light); padding: 50px 20px;">
        <h2 style="color: var(--primary-color);">ยินดีต้อนรับเข้าสู่บทเรียน! 🎉</h2>
        <p>กรุณาคลิกเลือกเมนูด้านบน เพื่อเริ่มต้นการเรียนรู้ได้เลยค่ะ</p>
      </div>
    </div>

    <!-- พื้นที่ทำงานของ Admin (ซ่อนไว้) -->
    <div id="admin-section" class="admin-box">
      <h2>🛠️ ระบบจัดการเนื้อหา (CMS)</h2>
      
      <div class="form-group">
        <label>หมวดหมู่ที่ต้องการเพิ่มสื่อ:</label>
        <select id="category" class="form-control">
          <option value="indicator">มาตรฐานและตัวชี้วัด</option>
          <option value="content">เนื้อหาบทเรียน / ความหมาย</option>
          <option value="video">สื่อวีดิทัศน์ (YouTube)</option>
          <option value="game">เกมการศึกษา (Kahoot, Wordwall ฯล)</option>
          <option value="worksheet">ใบงาน (PDF)</option>
        </select>
      </div>

      <div class="form-group">
        <label>ชื่อเรื่อง / หัวข้อ:</label>
        <input type="text" id="title" class="form-control" placeholder="เช่น การอ่านออกเสียงภาษาไทย">
      </div>

      <div class="form-group">
        <label>คำอธิบาย / ความหมาย (ใส่ลูกเล่นข้อความได้):</label>
        <textarea id="description" class="form-control" rows="3" placeholder="อธิบายเนื้อหา หรือบอกวิธีเล่นเกม..."></textarea>
      </div>

      <div class="form-group">
        <label>ลิงก์รูปภาพประกอบ (ถ้ามี):</label>
        <input type="url" id="imgUrl" class="form-control" placeholder="https://... (เอาลิงก์รูปมาวางเพื่อให้เว็บดูสวยงาม)">
      </div>

      <div class="form-group">
        <label>โค้ดฝังสื่อ (iframe) หรือลิงก์ YouTube:</label>
        <textarea id="embedCode" class="form-control" rows="4" placeholder="วางลิงก์วิดีโอ หรือ โค้ด iframe ของเกม/ใบงาน"></textarea>
      </div>
      
      <button class="save-btn" onclick="saveData()">💾 อัปโหลดข้อมูลขึ้นหน้าเว็บ</button>
    </div>

  </div>

  <!-- โหลด Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    // ⚠️ นำกุญแจ Firebase ของคุณมาวางตรงนี้เหมือนเดิม ⚠️
    const firebaseConfig = {
      apiKey: "AIzaSyD34HFIpO9LQc0GuFfiC1FuBd7fROOvIco",
      authDomain: "cee3501-9eba6.firebaseapp.com",
      databaseURL: "https://cee3501-9eba6-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cee3501-9eba6",
      storageBucket: "cee3501-9eba6.firebasestorage.app",
      messagingSenderId: "699916890411",
      appId: "1:699916890411:web:414a654d8024adbe33956e"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const displaySection = document.getElementById('display-section');
    const adminSection = document.getElementById('admin-section');

    function checkAdmin() {
      const password = prompt("รหัสผ่านผู้ดูแลระบบ:");
      if (password === "1234") { // เปลี่ยนรหัสผ่านตรงนี้ได้
        displaySection.style.display = "none";
        adminSection.style.display = "block";
      } else if (password !== null) {
        alert("รหัสผ่านไม่ถูกต้อง!");
      }
    }

    function loadData(category) {
      adminSection.style.display = "none";
      displaySection.style.display = "block";
      displaySection.innerHTML = "<div style='text-align:center; padding: 50px;'><h3 style='color:var(--primary-color);'>กำลังโหลดเนื้อหา... ⏳</h3></div>";

      db.collection("medias")
        .where("category", "==", category)
        .orderBy("timestamp", "desc")
        .get()
        .then((querySnapshot) => {
          displaySection.innerHTML = "";
          if(querySnapshot.empty) {
            displaySection.innerHTML = "<div class='card' style='text-align:center;'>ยังไม่มีเนื้อหาในหมวดหมู่นี้ค่ะ 📚</div>";
            return;
          }
          
          querySnapshot.forEach((doc) => {
            const data = doc.data();
            
            // สร้างโครงสร้างการ์ดที่สวยงาม
            let imageHTML = data.imgUrl ? `<img src="${data.imgUrl}" class="card-image" alt="รูปประกอบ">` : '';
            let descHTML = data.description ? `<p class="card-desc">${data.description.replace(/\n/g, '<br>')}</p>` : '';
            
            // ส่วนผสม Header ของการ์ด
            let headerHTML = '';
            if (imageHTML || descHTML) {
                headerHTML = `
                  <div class="card-header">
                    ${imageHTML}
                    <div class="card-info">
                      <h2 class="card-title">${data.title}</h2>
                      ${descHTML}
                    </div>
                  </div>
                `;
            } else {
                headerHTML = `<h2 class="card-title" style="margin-bottom:15px;">${data.title}</h2>`;
            }

            const div = document.createElement('div');
            div.className = "card";
            div.innerHTML = `
              ${headerHTML}
              ${data.embedCode}
            `;
            displaySection.appendChild(div);
          });
        })
        .catch((error) => {
          console.error("Error: ", error);
          displaySection.innerHTML = `<div class='card' style='color:red; text-align:center;'>⚠️ ระบบไม่สามารถดึงข้อมูลได้ โปรดตรวจสอบการเชื่อมต่อ</div>`;
        });
    }

    function saveData() {
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      const imgUrl = document.getElementById('imgUrl').value;
      let embed = document.getElementById('embedCode').value;

      if(!title) {
        alert("กรุณากรอกชื่อเรื่อง!"); return;
      }

      if(embed.includes("youtube.com/watch?v=")) {
        const videoId = embed.split("v=")[1].substring(0, 11);
        embed = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
      } else if (embed.includes("youtu.be/")) {
        const videoId = embed.split("youtu.be/")[1].substring(0, 11);
        embed = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
      }

      db.collection("medias").add({
        title: title,
        category: category,
        description: description,
        imgUrl: imgUrl,
        embedCode: embed,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("🎉 จัดเก็บข้อมูลสำเร็จแล้ว!");
        document.getElementById('title').value = '';
        document.getElementById('description').value = '';
        document.getElementById('imgUrl').value = '';
        document.getElementById('embedCode').value = '';
        loadData(category);
      }).catch((error) => {
        alert("เกิดข้อผิดพลาด: " + error.message);
      });
    }
  </script>
</body>
</html>
